[project]
name = "lmis"
version = "0.1.0"
description = "Labour Market Intelligence System — demand-supply gap forecasting for MSDE (SIH 2026)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.0",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "pandera>=0.20",
    "openpyxl>=3.1",
    "typer>=0.12",
    "tabulate",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
