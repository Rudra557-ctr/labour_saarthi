    geo_level_available: not_applicable
    occ_coding_scheme: NCO_2015
    period_grain: not_applicable
    update_cadence: "irregular (series revisions: 1946, 1958, 1968, 2004, 2015)"
    is_authoritative: true
    verification_status: VERIFIED_URL
    notes: >-
      Aligned to ISCO-2008. Three volumes. Text layer is glyph-encoded subset
      fonts; extraction requires pdfplumber + manual spot-check validation.
    files:
