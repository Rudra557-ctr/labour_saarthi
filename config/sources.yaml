# LMIS Source Registry
# ---------------------------------------------------------------------------
# One entry per external source. This file is the authority for provenance:
# nothing may be ingested unless it is registered here first (Step 0 layer L1,
# "licence gate").
#
# verification_status values:
#   VERIFIED_URL        - URL confirmed reachable/resolvable during Step 0/1
#   VERIFIED_EXISTS     - source confirmed to exist, exact download URL not yet fixed
#   UNVERIFIED          - existence or access method still to be established
#
# role: demand | supply | training | taxonomy | reference | context
# access_method: BULK_DOWNLOAD | API | PORTAL_REPORT | PDF | PORTAL_FORM | SCRAPE
#
# IMPORTANT: geo_level_available and occ_coding_scheme record what the source
# ACTUALLY publishes. They are never aspirational. "unknown" is a valid value
# and must stay "unknown" until verified.
# ---------------------------------------------------------------------------

schema_version: 1

sources:

  - source_id: NCO_2015
