      it joinable to our geography spine.
      ROLE: this is an ESTABLISHMENT / INDUSTRY-STRUCTURE signal, NOT labour
      demand. Enterprise registrations are not vacancies and must never be
      labelled as such. Its legitimate use is as an evidence-based district
      allocation basis and as a context feature.
      Keyless file URLs extracted from the resource pages:
      .../datafile/district_level_total_Registered_msme.csv?VersionId=105172500341441
      .../datafile/district_level_service_msme.csv?VersionId=105172390466305
      API UUIDs: f8cd85a1-f9b8-4ff1-b195-9f75c10eb338 (total),
      c3dfe7e6-0cfd-4ddb-8f79-9cb3695d9866 (services).
      VALIDATED 2026-10-02 via the apex host. Both files: 785 rows, columns
      state_name, lg_dist_code, district_name, micro, small, medium, total,
      last_updated. 785/785 lg_dist_code values join to lgd_districts.district_code
      - a clean 100% join.
      CONTRADICTION FOUND: the catalogue calls it "daily updated", but the actual
      files carry last_updated = 2023-12-21 for every row. It is a Dec-2023
      SNAPSHOT, not a daily feed. The catalogue claim is wrong.
      MISSINGNESS IS REAL: 'NA' appears in small (30 districts) and medium (123
      districts). These must stay missing - never zero-filled.
      MEASURE: cumulative registered enterprise COUNTS by size class, not a flow.

