  - source_id: NCS_API_PUBLIC
    source_name: National Career Service public web API (api.ncs.gov.in)
    publisher_org: Directorate General of Employment, Ministry of Labour & Employment
    landing_url: https://api.ncs.gov.in/
    role: reference
    access_method: API
    licence: "no published terms located; Government of India portal API - LICENCE UNCLEAR"
    licence_verified: false
    geo_level_available: state
    occ_coding_scheme: ncs_skill_keyword
    period_grain: snapshot
    update_cadence: continuous
    is_authoritative: true
    verification_status: VERIFIED_URL
    notes: >-
      Discovered 2026-10-02. These are the endpoints the PUBLIC, UNAUTHENTICATED
      ncs.gov.in homepage calls; no authentication was used or bypassed. No public
      API specification exists (/v3/api-docs 500, /openapi.json 401), so this is
      an undocumented surface and terms of use are UNCLEAR - must be confirmed
      with DGE before any production or published use.
      WORKING: /api/location/state returns 39 state names with standard Indian
      state codes (Bihar 10, Maharashtra 27, Tamil Nadu 33 - these match the
      Census/LGD state numbering, which is useful for the geography spine but is
      NOT a substitute for LGD district codes).
      WORKING: /employer-service/api/v1/hiring/top-companies?year=&limit= returns
      employer-level totalVacancies - real demand data, but by COMPANY, with no
      location, occupation or date dimension.
      WORKING: /api/jobseeker/profiles/career-timeline/get-skills?keyword= returns
      an id+keyword job-title/skill dictionary, usable as mapping input, not demand.
      NOT USABLE: /api/locations returns an ENCRYPTED payload (opaque ciphertext),
      so the district list cannot be read from it.
      NO job-search / vacancy-by-location / vacancy-by-occupation endpoint was
      found on this public surface.

  - source_id: NCS_PARLIAMENTARY_ANSWERS
    source_name: NCS vacancy statistics in Parliament answers (Lok Sabha / Rajya Sabha)
    publisher_org: Ministry of Labour & Employment
    landing_url: https://dge.gov.in/
    role: demand
    access_method: PDF
    licence: Parliament of India / Government of India published answer
    licence_verified: false
    geo_level_available: national, state
    occ_coding_scheme: ncs_sector (22 categories, NOT NCO, NOT the NQR 59 sectors)
    period_grain: cumulative since inception, as-on a stated date
    update_cadence: irregular (per question answered)
    is_authoritative: true
    verification_status: VERIFIED_URL
    notes: >-
      THE BEST REAL OFFICIAL DEMAND DATA LOCATED. Verified by extraction of 4 PDFs.
      Structure per answer: gender-wise table; STATE-WISE vacancies (39 rows,
      absolute numbers); SECTOR-WISE vacancies (22 rows, in lakh).
      Reconciliation PASSED: state rows sum exactly to the published grand total
      35,275,833 as on 2024-11-15.
      CRITICAL LIMITATIONS, all verified not assumed:
      (1) the measure is CUMULATIVE VACANCIES MOBILISED SINCE INCEPTION - a stock,
          not a monthly flow. A flow can only be derived by differencing two dated
          snapshots.
      (2) 20,507,320 of 35,275,833 vacancies (58.1%) are booked to
          "Multiple States/PAN India" and are therefore NOT attributable to any
          state. Only 41.9% is state-attributable.
      (3) state-wise and sector-wise are SEPARATE MARGINAL tables. There is NO
          joint state x sector cross-tabulation, so state x sector cannot be
          derived from them.
      (4) NO district. NO occupation. NO NCO code. NO time series within a document.
      (5) units differ between tables (absolute for state, lakh for sector).
      NOTE: URLs use https://dge.gov.in/sites/default/files/<YYYY-MM>/<id>_e.pdf .
      The /dge/sites/... form reported by web search returns HTTP 404.
    files:
      - name: RS_UQ2798_2024-12-19.pdf
        url: https://dge.gov.in/sites/default/files/2025-05/2798_e.pdf
        purpose: Rajya Sabha UQ 2798, state-wise + sector-wise vacancies as on 2024-11-15
      - name: LS_UQ933_2024-12-02.pdf
        url: https://dge.gov.in/sites/default/files/2025-05/933_e.pdf
        purpose: Lok Sabha UQ 933, same measures as on 2024-11-15
      - name: LS_UQ2225_2024-12-09.pdf
        url: https://dge.gov.in/sites/default/files/2025-05/2225_e.pdf
        purpose: Lok Sabha UQ 2225
      - name: NCS_UQ1264.pdf
        url: https://dge.gov.in/sites/default/files/2025-09/1264_e.pdf
        purpose: later NCS answer, for differencing to obtain a flow

  - source_id: LGD_DISTRICTS_DATAGOVIN
    source_name: Local Government Directory - Districts (data.gov.in mirror)
    publisher_org: Ministry of Panchayati Raj (published via NIC / data.gov.in)
    landing_url: https://www.data.gov.in/resource/local-government-directory-lgd-districts
    role: reference
    access_method: BULK_DOWNLOAD
    licence: Government Open Data Licence - India (per resource, to confirm)
    licence_verified: false
    geo_level_available: state, district, sub_district
    occ_coding_scheme: not_applicable
    period_grain: snapshot (2023-11-30 / 2023-12-01 vintages)
    update_cadence: mirror is static; LGD itself updates monthly
    is_authoritative: true
    verification_status: VERIFIED_URL
    files:
      - name: lgd_states.csv
        url: https://data.gov.in/files/ogdpv2dms/s3fs-public/datafile/lgd_states.csv
        purpose: 36 states/UTs with LGD + Census-2011 state codes
      - name: lgd_districts.csv
        url: https://data.gov.in/files/ogdpv2dms/s3fs-public/datafile/lgd_districts.csv
        purpose: 785 districts with LGD codes and the official Census-2011 crosswalk
      - name: lgd_subdistricts.csv
        url: https://data.gov.in/files/ogdpv2dms/s3fs-public/datafile/lgd_subdistricts.csv
        purpose: sub-district tier
    notes: >-
      DISCOVERED Step 1.6. This is the route around the LGD CAPTCHA: the
      data.gov.in resource page embeds a DIRECT, KEYLESS file URL in its Nuxt
      SSR payload (extracted by scripts/probe_datagovin.py):
      https://www.data.gov.in/files/ogdpv2dms/s3fs-public/datafile/lgd_districts.csv
      and an API resource UUID 37231365-78ba-44d5-ac22-3deec40b9197 for use with
      a registered data.gov.in API key.
      RESOLVED Step 1.7: the WWW host 403s but the APEX host serves the files.
      Working base: https://data.gov.in/files/ogdpv2dms/s3fs-public/datafile/
      VALIDATED 2026-10-02: lgd_states.csv 36 rows (28 S + 8 U, state_code unique,
      vintage 2023-12-01); lgd_districts.csv 785 rows (district_code unique, all 36
      states present, vintage 2023-11-30); lgd_subdistricts.csv 1.27 MB.
      lgd_districts.csv CARRIES AN OFFICIAL LGD <-> CENSUS-2011 DISTRICT CROSSWALK
      (district_census2011_code), which is what makes Census B-series joinable.
      KEY LIMITATION: 125 of 785 districts (15.9%) have district_census2011_code
      '000' - they post-date Census 2011, so they cannot be joined to any Census
      table. Pilot states: Maharashtra 36 districts (1 unjoinable), Tamil Nadu 38
      (6 unjoinable, 15.8%), Uttar Pradesh 75 (4 unjoinable).
      SECOND LIMITATION: this mirror is a 2023-11-30 snapshot, while LGD itself
      updates monthly - it is roughly two years stale and is NOT a live feed.
      THIRD LIMITATION: the CSV does NOT expose split/merge/rename events, parents
      or effective dates. Absence of a Census-2011 code is the only change evidence
      it provides, so location_change_event cannot be populated from it.

