  - source_id: CENSUS_2011_B24
    source_name: "Census 2011 Table B-24: occupational classification of main workers"
    publisher_org: Office of the Registrar General and Census Commissioner, India
    landing_url: https://censusindia.gov.in/nada/index.php/catalog/13648
    role: context
    access_method: BULK_DOWNLOAD
    licence: Government of India / ORGI published tables; terms to confirm
