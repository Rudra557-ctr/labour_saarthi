  - source_id: ILOSTAT_EMP_ECO_OCU
    source_name: "ILOSTAT: Employment by economic activity and occupation (India)"
    publisher_org: International Labour Organization (derived from India's Periodic Labour Force Survey)
    landing_url: https://rplumber.ilo.org/__docs__/
    role: context
    access_method: API
    licence: "ILO terms of use; ILOSTAT data is published for public reuse with attribution - CONFIRM exact terms before publication"
    licence_verified: false
    geo_level_available: national
    occ_coding_scheme: ISCO_08_MAJOR_GROUP
    period_grain: year
    update_cadence: annual (last update 2026-10-02 per ILOSTAT catalogue)
    is_authoritative: true
    verification_status: VERIFIED_URL
    notes: >-
      RESOLVES the industry->occupation bridge question, at NATIONAL level only.
      Indicator EMP_TEMP_ECO_OCU_NB_A, "Employment by economic activity and
      occupation (thousands)", annual, ILO Labour Force Statistics database.
      PROVENANCE: for India the source code is BA:14121 = "LFS - Periodic Labour
      Force Survey" - i.e. this IS India's own PLFS, harmonised and published by
      the ILO as a cross-tabulation that MoSPI does not publish directly.
      STRUCTURE (verified): classif1 = economic activity (ISIC-Rev.4 section),
      classif2 = occupation (ISCO-08 major group), obs_value in THOUSANDS of
      persons. For India, 751 rows at ISIC4-section x ISCO08-major-group level
      across 2022, 2023, 2024, 2025. For 2025: 20 sections (A-T) + TOTAL x 9
      major groups, 184 of 189 cells populated.
      WHY IT BRIDGES: NIC-2008 is the Indian adaptation of ISIC-Rev.4 and its
      section letters/titles align (verified against the official NIC-2008 PDF);
      NCO-2015 has a documented ONE-TO-ONE correspondence with ISCO-08 where the
      first digit is the Division/Major Group (NCVET report, Annexure IX s.3).
      So ISIC4 section x ISCO08 major group maps to NIC-2008 section x NCO-2015
      division without inventing anything.
      KEY LIMITATION: ref_area is IND only. There is NO state dimension, so
      P(occupation | industry, STATE) is NOT available - only
      P(occupation | industry) nationally.
    files:
