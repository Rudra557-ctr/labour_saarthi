    update_cadence: decennial
    is_authoritative: true
    verification_status: VERIFIED_URL
    tls_intermediate: emSign_SSL_CA_G1.pem
    notes: >-
      ACQUIRED Step 3.0. censusindia.gov.in serves only its leaf certificate and
      omits the emSign intermediate CA, so strict TLS clients fail with
      "unable to get local issuer certificate". Resolved by fetching that
      intermediate from the CA repository URL the server's own certificate
      advertises in its AIA extension, and appending it to the certifi roots.
      The completed chain verifies to the publicly trusted emSign Root CA - G1
      (openssl: "Verify return code: 0 (ok)"). Certificate verification remains
      FULLY ENABLED; verify=False is used nowhere. See config/certs/README.md.
      STRUCTURE (verified by reading the files): columns are Table name, State
      code, District code, Area Name, Division, Sub-Division, NCO name,
      Total/Rural/Urban, Persons, Males, Females. District code '000' denotes the
      state total; other codes are districts. Occupation is NCO-2004 at DIVISION
      (1-digit) and SUB-DIVISION (2-digit) level only - NOT the 8-digit codes our
      official concordance keys on.
      CLASSIFICATION: HISTORICAL WORKFORCE STRUCTURE as at 2011. It is NOT
      employer demand and must never be relabelled as demand.
      SCOPE NOTE: B-24 covers main workers in NON-HOUSEHOLD industry, trade,
      business, profession or service - it is not all workers.
      Catalogue numbering: catalog/(13648 + census_state_code).
    files:
